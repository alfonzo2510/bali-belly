<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bali Belly Challenge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌺</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B3C49;--card:#115462;--ink:#FFF8EC;--mute:#A9CFD2;--sun:#FFB627;--coral:#FF6B4A;--leaf:#7BE0A1;--line:#1E6F7E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,.big{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0}
main{max-width:620px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(160deg,var(--coral),var(--sun));color:#3A1500;border-radius:24px;padding:22px 20px;margin-bottom:14px}
.hero h1{font-size:2rem;font-weight:800;line-height:1.05}
.hero p{margin:6px 0 0;font-weight:500}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
.quote{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;line-height:1.35}
.quote small{display:block;font:500 .85rem "DM Sans";color:var(--sun);margin-bottom:6px}
.leader{display:flex;align-items:center;gap:14px;border:2px solid var(--sun)}
.leader .big{font-size:2.6rem;font-weight:800;color:var(--sun);line-height:1}
.crown{font-size:2.2rem}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--mute);font-size:.85rem}
tr:last-child td{border:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.up{color:var(--leaf);font-weight:500;font-size:.85rem}
.wait{color:var(--mute);font-size:.8rem}
.me td:nth-child(2){color:var(--sun)}
input,button{font:inherit;border-radius:12px;border:2px solid var(--line);padding:12px;width:100%;background:#0B3C49;color:var(--ink);margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun)}
button{background:var(--sun);color:#3A1500;font-weight:700;border-color:var(--sun);cursor:pointer}
button.ghost{background:none;color:var(--mute);border-color:var(--line)}
.err{color:#FFB4A2;min-height:1.4em;margin:0 0 8px}
.ok{color:var(--leaf);font-weight:700}
.row{display:flex;gap:10px}.row>*{flex:1}
.note{color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<main id="app"><p class="note">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== EDIT THESE ======
const SUPABASE_URL = "https://evofpqyprblarigeivxj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_d6itsUT_IpTOCWbp7_8wPw_PD4NncSJ";
const FIRST_MONDAY = "2026-10-12"; // Week 1 weigh-in (must be a Monday)
// Weekly motivation: one per week, then it loops. Add your own!
const QUOTES = [
  "Every journey to Bali starts with one small step off the sofa.",
  "You're not shrinking your life, you're making room for the sunsets.",
  "Progress is quiet. Show up anyway.",
  "Your future beach self is cheering you on. Don't leave them hanging.",
  "Discipline is just choosing what you want most over what you want now.",
  "Small habits, big belly-laughs in the sun.",
  "The scale is a snapshot. The habit is the movie.",
  "Be proud of the person who started. Be kinder to the one who's here.",
  "Sweat now, sip the coconut later.",
  "Nobody fell behind. Everybody's just on their own wave.",
  "Strong, steady, sun-bound.",
  "Last stretch. Finish like the island is waiting. It is."
];
// ========================
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let timer, session, status;

const SYD = new Intl.DateTimeFormat("en-US",{timeZone:"Australia/Sydney",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",hour12:false,weekday:"short"});
function syd(ms){const o={};SYD.formatToParts(ms).forEach(p=>o[p.type]=p.value);
  return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour%24,wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday)}}
function mondayNow(){const s=syd(Date.now());return new Date(Date.UTC(s.y,s.m-1,s.d-(s.wd+6)%7)).toISOString().slice(0,10)}
function weekNo() { return Math.floor((Date.parse(mondayNow()) - Date.parse(FIRST_MONDAY)) / 6048e5) + 1; }
const fmt = n => (n > 0 ? "" : n < 0 ? "−" : "") + Math.abs(n).toFixed(1) + "%";
const hero = `<div class="hero"><h1>🌺 Bali Belly Challenge</h1><p>6 people. 1 island. Zero kilos shown, only progress.</p></div>`;

async function boot() {
  const { data } = await db.auth.getSession();
  session = data.session;
  db.auth.onAuthStateChange((_e, s) => { if (!!s !== !!session) { session = s; boot(); } });
  clearInterval(timer);
  if (!session) return authView();
  const r = await db.rpc("my_status");
  status = r.data;
  if (!status || !status.joined) return joinView();
  dash(); timer = setInterval(dash, 30000);
  document.onvisibilitychange = () => !document.hidden && session && dash();
}

function authView(mode = "in") {
  const up = mode === "up";
  app.innerHTML = hero + `<div class="card"><h2>${up ? "Join the challenge" : "Welcome back"}</h2><br>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${up ? "new" : "current"}-password">
  <p class="err" id="err"></p>
  <button id="go">${up ? "Create my login" : "Sign in"}</button>
  <button class="ghost" id="sw">${up ? "I already have a login" : "First time? Create a login"}</button></div>`;
  $("#sw").onclick = () => authView(up ? "in" : "up");
  $("#go").onclick = async () => {
    const c = { email: $("#em").value.trim(), password: $("#pw").value };
    const { error } = up ? await db.auth.signUp(c) : await db.auth.signInWithPassword(c);
    if (error) $("#err").textContent = error.message;
  };
}

function joinView() {
  app.innerHTML = hero + `<div class="card"><h2>Pick your name & starting line</h2>
  <p class="note">Your starting weight is locked in and never shown to anyone, including you. Everyone only sees % lost.</p>
  <input id="nm" placeholder="Display name (e.g. Kez)" maxlength="20">
  <input id="sw" type="number" inputmode="decimal" step="0.1" placeholder="Starting weight (kg)">
  <p class="err" id="err"></p><button id="go">Lock it in</button></div>`;
  $("#go").onclick = async () => {
    const { error } = await db.rpc("join_challenge", { p_name: $("#nm").value, p_start: +$("#sw").value });
    if (error) $("#err").textContent = error.message; else boot();
  };
}

async function dash() {
  const [lb, st] = await Promise.all([db.rpc("leaderboard"), db.rpc("my_status")]);
  if (lb.error) return;
  status = st.data;
  const cur = mondayNow(), people = {};
  lb.data.forEach(r => (people[r.name] ||= []).push(r));
  const rows = Object.entries(people).map(([name, rs]) => {
    const w = rs.filter(r => r.week_start).sort((a, b) => a.week_start < b.week_start ? -1 : 1);
    const now = w.length ? +w[w.length - 1].pct : 0, prev = w.length > 1 ? +w[w.length - 2].pct : 0;
    return { name, now, delta: w.length ? now - prev : 0, done: w.length && w[w.length - 1].week_start === cur };
  }).sort((a, b) => b.now - a.now);
  const lead = rows[0], started = lead && lead.now > 0;
  const q = QUOTES[((weekNo() - 1) % QUOTES.length + QUOTES.length) % QUOTES.length];
  app.innerHTML = hero +
    `<div class="card quote"><small>Week ${Math.max(weekNo(), 1)} motivation</small>${esc(q)}</div>
    <div class="card" style="text-align:center"><div class="note">Next weigh-in · Monday 7am Sydney time</div><div class="big" id="cd" style="font-size:2rem;color:var(--sun)"></div></div>
    <div class="card leader"><div class="crown">👑</div><div><div class="note">${started ? "Current leader" : "The race is on"}</div>
    <h2>${started ? esc(lead.name) : "Nobody yet. Be first!"}</h2></div>${started ? `<div class="big" style="margin-left:auto">${fmt(lead.now)}</div>` : ""}</div>
    <div class="card"><h2 style="margin-bottom:6px">Leaderboard</h2><table><tr><th></th><th>Name</th><th style="text-align:right">% lost</th></tr>
    ${rows.map((r, i) => `<tr class="${r.name === "" ? "me" : ""}"><td>${["🥇", "🥈", "🥉"][i] || i + 1}</td>
    <td>${esc(r.name)} ${r.done ? "" : '<span class="wait">⏳ weigh-in due</span>'}</td>
    <td class="n">${fmt(r.now)}<br>${r.delta ? `<span class="up">${r.delta > 0 ? "▲" : "▼"} ${fmt(Math.abs(r.delta))}</span>` : ""}</td></tr>`).join("")}</table>
    <p class="note">Updates every Monday weigh-in. Rankings refresh live.</p></div>
    <div class="card"><h2>Monday weigh-in</h2>
    ${status.logged ? `<p class="ok">✓ Logged for this week. Nice work!</p>` : ""}
    <p class="note">${status.logged ? "Made a mistake? Enter it again to replace it." : "Enter this Monday's weight. Only the % change is ever shown."}</p>
    <input id="wt" type="number" inputmode="decimal" step="0.1" placeholder="Today's weight (kg)">
    <p class="err" id="err"></p><button id="go">${status.logged ? "Replace weigh-in" : "Log my weigh-in"}</button>
    <button class="ghost" id="out">Sign out</button></div>`;
  $("#go").onclick = async () => {
    const v = +$("#wt").value; if (!v) return;
    const { error } = await db.rpc("submit_weight", { p_weight: v });
    if (error) $("#err").textContent = error.message; else dash();
  };
  $("#out").onclick = () => db.auth.signOut();
  tick();
}
function nextWeighIn(){if(syd(Date.now()).wd===1)return null;
  let t=Math.ceil(Date.now()/36e5)*36e5;while(true){const s=syd(t);if(s.wd===1&&s.h===7)return t;t+=36e5}}
function tick(){const e=$("#cd");if(!e)return;const t=nextWeighIn();
  if(t===null){e.textContent="🎉 It's weigh-in day!";return}
  const s=Math.max(0,Math.floor((t-Date.now())/1e3)),p=n=>String(n).padStart(2,"0");
  e.textContent=`${Math.floor(s/864e2)}d ${p(Math.floor(s%864e2/3600))}h ${p(Math.floor(s%3600/60))}m ${p(s%60)}s`}
setInterval(tick,1000);
boot();
</script>
</body>
</html>
